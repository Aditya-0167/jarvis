name: JARVIS Continuous Development

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  train-and-evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout persistent JARVIS state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Initialize if needed
        run: python main.py init

      - name: Train from-scratch model
        run: python main.py train-cloud --steps 500

      - name: Evolve software-level mind
        run: python main.py evolve

      - name: Persist state
        run: |
          git config user.name "JARVIS Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add data/ workspace/ versions/
          git diff --cached --quiet || git commit -m "JARVIS autonomous development cycle"
          git push
